<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#03000a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="CableBox" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/cablebox-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/cablebox-192.png" />
    <link rel="apple-touch-icon" href="/icons/cablebox-192.png" />
    <link rel="manifest" href="/manifest.json" />
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&family=Outfit:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
    <title>CableBox</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html { width: 100%; height: 100%; background: #000; }
      body { width: 100%; height: 100%; overflow: hidden; background: #000; }
      #root {
        width: 100%;
        height: 100%;
        min-height: -webkit-fill-available;
        overflow: hidden;
        background: #000;
      }
    </style>
  </head>
  <body>
    <script>
      // Polyfills for older TV browsers
      if (typeof AbortController === 'undefined') {
        window.AbortController = function() {
          var listeners = []
          this.signal = {
            aborted: false,
            addEventListener: function(_, fn) { listeners.push(fn) },
            removeEventListener: function(_, fn) { listeners = listeners.filter(function(l) { return l !== fn }) }
          }
          this.abort = function() {
            if (this.signal.aborted) return
            this.signal.aborted = true
            listeners.forEach(function(fn) { fn() })
          }.bind(this)
        }
      }
      if (typeof fetch === 'undefined') {
        window.fetch = function(url, options) {
          return new Promise(function(resolve, reject) {
            var xhr = new XMLHttpRequest()
            options = options || {}
            xhr.open(options.method || 'GET', url, true)
            if (options.headers) {
              Object.keys(options.headers).forEach(function(key) {
                xhr.setRequestHeader(key, options.headers[key])
              })
            }
            if (options.signal) {
              options.signal.addEventListener('abort', function() {
                xhr.abort()
                reject({ name: 'AbortError', message: 'Aborted' })
              })
            }
            xhr.onload = function() {
              var body = xhr.responseText
              resolve({
                ok: xhr.status >= 200 && xhr.status < 300,
                status: xhr.status,
                statusText: xhr.statusText,
                headers: { get: function(h) { return xhr.getResponseHeader(h) } },
                text: function() { return Promise.resolve(body) },
                json: function() { return Promise.resolve(JSON.parse(body)) },
                blob: function() { return Promise.resolve(new Blob([body])) }
              })
            }
            xhr.onerror = function() { reject(new TypeError('Network request failed')) }
            xhr.ontimeout = function() { reject(new TypeError('Network request timed out')) }
            xhr.send(options.body !== undefined ? options.body : null)
          })
        }
      }
      if (typeof Promise.allSettled === 'undefined') {
        Promise.allSettled = function(promises) {
          return Promise.all(promises.map(function(p) {
            return Promise.resolve(p).then(
              function(v) { return { status: 'fulfilled', value: v } },
              function(r) { return { status: 'rejected', reason: r } }
            )
          }))
        }
      }
    </script>

    <div id="root">
      <div style="width:100%;height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#000;gap:20px">
        <div style="width:40px;height:40px;border:2px solid rgba(255,255,255,0.2);border-top-color:#fff;border-radius:50%;animation:sp 1s linear infinite"></div>
        <div style="color:#fff;font-family:monospace;font-size:20px;letter-spacing:4px">CABLEBOX</div>
      </div>
      <style>@keyframes sp{to{transform:rotate(360deg)}}</style>
    </div>
    <noscript>
      <div style="background:#000;color:#fff;font-family:monospace;font-size:20px;padding:40px;text-align:center">
        JavaScript is required to run CableBox.
      </div>
    </noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
